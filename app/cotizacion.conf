# =============================================================================
# cotizacion.conf — VirtualHost Apache como proxy reverso a Gunicorn
# Instalar en: /etc/httpd/conf.d/cotizacion.conf
# =============================================================================

<VirtualHost *:80>
    ServerName   cotizacion.empresa.local
    ServerAlias  _default_

    # ---- Proxy reverso a Gunicorn (socket UNIX) ----
    ProxyPreserveHost On
    ProxyPass         /static         !
    ProxyPass         /server-status  !
    ProxyPass         /server-info    !
    ProxyPass         / unix:/run/cotizacion/gunicorn.sock|http://localhost/
    ProxyPassReverse  / unix:/run/cotizacion/gunicorn.sock|http://localhost/

    # ---- Archivos estáticos servidos directamente por Apache ----
    Alias /static /opt/cotizacion/app/static

    <Directory /opt/cotizacion/app/static>
        Require all granted
        Options -Indexes
    </Directory>

    # ---- Seguridad básica ----
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ---- Logs ----
    ErrorLog  /var/log/httpd/cotizacion_error.log
    CustomLog /var/log/httpd/cotizacion_access.log combined

</VirtualHost>
