# =============================================================================
# cotizacion.conf — VirtualHost Apache para la aplicación Flask
# Instalar en: /etc/httpd/conf.d/cotizacion.conf
# Requiere: mod_wsgi (python3-mod_wsgi del AppStream de RHEL 9)
# =============================================================================

# Cargar módulo WSGI para Python 3 (incluido en RHEL 9 AppStream oficial)
LoadModule wsgi_module modules/mod_wsgi_python3.so

<VirtualHost *:80>
    ServerName   cotizacion.empresa.local
    ServerAlias  www.cotizacion.empresa.local

    # ---- WSGI ----
    WSGIDaemonProcess cotizacion \
        user=cotizacion \
        group=cotizacion \
        python-home=/opt/cotizacion/venv \
        python-path=/opt/cotizacion/app \
        threads=5 \
        display-name=%{GROUP}

    WSGIProcessGroup  cotizacion
    WSGIScriptAlias   / /opt/cotizacion/app/wsgi.py

    # ---- Archivos estáticos servidos directamente por Apache ----
    Alias /static /opt/cotizacion/app/static

    <Directory /opt/cotizacion/app/static>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /opt/cotizacion/app>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # ---- Seguridad básica ----
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ---- Logs ----
    ErrorLog  /var/log/httpd/cotizacion_error.log
    CustomLog /var/log/httpd/cotizacion_access.log combined

</VirtualHost>
