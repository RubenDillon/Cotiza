# instana-status.conf — mod_status para el agente Instana
# Instalar en: /etc/httpd/conf.d/instana-status.conf
# El agente consulta: http://127.0.0.1/server-status?auto

# mod_status accesible SOLO desde localhost
<Location "/server-status">
    SetHandler server-status
    Require ip 127.0.0.1
    Require ip ::1
</Location>
