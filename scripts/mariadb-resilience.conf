# =============================================================================
# /etc/systemd/system/mariadb.service.d/cotizacion-resilience.conf
# Drop-in systemd para mejorar la resiliencia de MariaDB:
#   - Reinicio automático más rápido (5s en lugar del default)
#   - Más reintentos antes de rendirse
#   - Límite de memoria para evitar que el OOM killer lo mate
#     (ajustar MemoryMax según la RAM disponible en la VM)
# =============================================================================
[Service]
# Reiniciar siempre que falle (no solo en errores de proceso)
Restart=always
RestartSec=5

# Reintentar hasta 10 veces en una ventana de 5 minutos
# (default es 5 veces en 10 segundos, muy agresivo)
StartLimitIntervalSec=300
StartLimitBurst=10

# Notificar en el journal cuando se reinicia
ExecStartPost=/bin/bash -c 'systemd-cat -t mariadb-restart echo "MariaDB reiniciado por systemd — $(date)"'
