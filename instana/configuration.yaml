# =============================================================================
# configuration.yaml — Configuración del agente Instana para la VM RHEL 9.6
# Ubicación en la VM: /opt/instana/agent/etc/instana/configuration.yaml
# =============================================================================

# --- Identificación y tags del host ---
com.instana.plugin.host:
  tags:
    - 'app:cotizacion-moneda'
    - 'env:production'
    - 'stack:lamp'
    - 'os:rhel9'

# --- Ignorar procesos del sistema RHEL que no tienen sensor Instana ---
# Esto elimina los errores python_sensor_not_installed de los servicios
# del sistema operativo que usan /usr/bin/python3
com.instana.ignore.processes:
  - 'firewalld'
  - 'tuned'
  - 'tuned-ppd'
  - 'fail2ban-server'
  - 'rhsm-service'

# --- Apache HTTP Server ---
# mod_status debe estar habilitado en /server-status (ya configurado)
com.instana.plugin.apachehttpd:
  enabled: true

# --- MariaDB (plugin mysql del agente Instana) ---
com.instana.plugin.mysql:
  enabled: true
  instances:
    - host: 'localhost'
      port: '3306'
      user: 'app_cotizacion'
      password: 'AppCotiz#2025!'

# --- Tracing distribuido ---
com.instana.tracing:
  enabled: true
  extra-http-headers:
    - 'x-request-id'
    - 'x-forwarded-for'
