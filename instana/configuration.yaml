# =============================================================================
# configuration.yaml — Configuración del agente Instana para la VM RHEL 9.6
# Ubicación en la VM: /opt/instana/agent/etc/instana/configuration.yaml
# Sintaxis validada contra configuration.yaml.template del agente instalado
# =============================================================================

# --- Identificación y tags del host ---
com.instana.plugin.host:
  tags:
    - 'app:cotizacion-moneda'
    - 'env:production'
    - 'stack:lamp'
    - 'os:rhel9'

# --- Ignorar procesos del sistema RHEL que no tienen sensor Instana ---
# Sintaxis exacta del template: com.instana.ignore > processes
# Elimina errores python_sensor_not_installed de firewalld, tuned, fail2ban, rhsm
com.instana.ignore:
  processes:
    - 'firewalld'
    - 'tuned'
    - 'tuned-ppd'
    - 'fail2ban-server'
    - 'rhsm-service'

# --- Apache HTTP Server ---
# mod_status habilitado en /server-status (ver instana-status.conf)
com.instana.plugin.apachehttpd:
  enabled: true

# --- MariaDB ---
# Sintaxis exacta del template: solo user y password.
# El agente detecta host/puerto automáticamente desde el proceso mariadbd.
com.instana.plugin.mariadb:
  user: 'app_cotizacion'
  password: 'AppCotiz#2025!'

# --- Tracing distribuido ---
com.instana.tracing:
  enabled: true
  extra-http-headers:
    - 'x-request-id'
    - 'x-forwarded-for'
