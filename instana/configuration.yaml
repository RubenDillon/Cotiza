# =============================================================================
# configuration.yaml — Configuración del agente Instana para la VM RHEL 9.6
# Ubicación en la VM: /opt/instana/agent/etc/instana/configuration.yaml
# =============================================================================

# --- Identificación y tags del host ---
com.instana.plugin.host:
  tags:
    - 'app:cotizacion-moneda'
    - 'env:production'
    - 'stack:lamp'
    - 'os:rhel9'

# --- Apache HTTP Server ---
# El agente accede a /server-status via 127.0.0.1 — el VirtualHost debe
# responder en esa IP. Se especifica la URL exacta con auto para parseo.
com.instana.plugin.apachehttpd:
  enabled: true
  status_url: 'http://127.0.0.1/server-status?auto'

# --- MariaDB ---
# sslTrustStore vacío deshabilita SSL efectivamente.
# El agente detecta el proceso mariadbd automáticamente.
com.instana.plugin.mariadb:
  user: 'app_cotizacion'
  password: 'AppCotiz#2025!'
  poll_rate: 10

# --- Tracing distribuido ---
com.instana.tracing:
  enabled: true
  extra-http-headers:
    - 'x-request-id'
    - 'x-forwarded-for'
