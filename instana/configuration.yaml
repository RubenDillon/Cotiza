# =============================================================================
# configuration.yaml — Configuración del agente Instana para la VM RHEL 9.6
# Ubicación en la VM: /opt/instana/agent/etc/instana/configuration.yaml
# =============================================================================

# --- Identificación y tags del host ---
com.instana.plugin.host:
  tags:
    - 'app:cotizacion-moneda'
    - 'env:production'
    - 'stack:lamp'
    - 'os:rhel9'

# --- Apache HTTP Server ---
# mod_status habilitado en /server-status (configurado en instana-status.conf)
com.instana.plugin.apachehttpd:
  enabled: true

# --- MariaDB ---
# enableSsl: false es obligatorio cuando MariaDB no tiene SSL configurado.
# Sin este parámetro el sensor intenta conectar con SSL y falla con:
# "Database connection is not established. Please check SSL configuration"
com.instana.plugin.mariadb:
  enabled: true
  instances:
    - host: 'localhost'
      port: 3306
      user: 'app_cotizacion'
      password: 'AppCotiz#2025!'
      enableSsl: false

# --- Procesos a monitorear y excluir ---
# Se listan explícitamente los procesos de la app y se excluyen los del
# sistema RHEL que usan /usr/bin/python3 sin sensor Instana instalado.
com.instana.plugin.process:
  processes:
    - 'httpd'
    - 'gunicorn'
    - 'mariadbd'
  # Excluir servicios del sistema RHEL que generan python_sensor_not_installed
  ignore-processes:
    - 'firewalld'
    - 'tuned'
    - 'tuned-ppd'
    - 'fail2ban-server'
    - 'rhsm-service'

# --- Tracing distribuido ---
com.instana.tracing:
  enabled: true
  extra-http-headers:
    - 'x-request-id'
    - 'x-forwarded-for'
